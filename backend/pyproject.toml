[project]
name = "confab"
version = "0.5.0"
description = "Group chat with Amazon Bedrock models: mention one and it answers, and they can pull each other in"
readme = "../README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.6",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
confab = "confab.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "src.confab.main:app"
