name: Run Database Migrations

on:
  workflow_call:
    secrets:
      CONFAB_DATABASE_URL:
        required: true

permissions: {}

# A running migration is never cancelled; a second one waits its turn.
concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --no-dev

      - name: Run Alembic migrations
        working-directory: backend
        env:
          CONFAB_DATABASE_URL: ${{ secrets.CONFAB_DATABASE_URL }}
          PYTHONPATH: src
        run: |
          if [ -z "$CONFAB_DATABASE_URL" ]; then
            echo "::error::The production migration database URL is not configured."
            exit 1
          fi
          uv run alembic upgrade head
